# Publie une version de Mandarine : il suffit de pousser une étiquette  vX.Y.Z  (ex. git tag v1.1.0 && git push origin v1.1.0).
# L'app est compilée (Apple Silicon + Intel), signée pour les mises à jour automatiques, puis publiée dans « Releases ».
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version et dépôt
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GITHUB_REPO=${GITHUB_REPOSITORY}" > Scripts/update.conf
      - name: Compiler et empaqueter
        run: UNIVERSAL=1 Scripts/package.sh
      - name: Signer la mise à jour
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: swift Scripts/update_tool.swift sign dist/Mandarine.zip > dist/Mandarine.zip.sig
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Mandarine.zip dist/Mandarine.zip.sig dist/Mandarine.dmg --title "Mandarine ${APP_VERSION}" --generate-notes
